name: 'Statsig Publish SDK Action'
description: 'Pushes releases from private to public SDK repositories'
author: 'Statsig'

inputs:
  kong-private-key:
    description: 'The private key required to run the Kong Github App'
    required: true

  npm-token:
    description: 'The NPM Access Token'

  pypi-token:
    description: 'The PyPI Access Token'

  pypi-beta-token:
    description: 'The PyPI Access Token For Beta Releases'

  rubygems-key:
    description: 'The RubyGems API Key'

  cargo-token:
    description: 'The Crates.io Registry Token'

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      if: ${{ inputs.pypi-token != '' || inputs.pypi-beta-token != '' }}
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
      with:
        python-version: "3.10"

    - name: Install Python Tools
      if: ${{ inputs.pypi-token != '' || inputs.pypi-beta-token != '' }}
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine

    - name: Setup Ruby
      if: ${{ inputs.rubygems-key != '' }}
      uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1
      with:
        ruby-version: '3.0'

    # - name: Print Action Info
    #   shell: bash
    #   run: echo "${{ toJson(github) }}"

    - name: Check Node
      id: node-check
      if: contains(fromJson('["push", "pull_request", "release"]'), github.event_name)
      shell: bash
      run: |
        major=0
        if command -v node >/dev/null 2>&1; then
          echo "Found node $(node --version) at $(command -v node)"
          major=$(node -p 'process.versions.node.split(".")[0]')
        fi
        if [ "$major" -ge 22 ]; then
          echo "setup-needed=false" >> "$GITHUB_OUTPUT"
        else
          echo "setup-needed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Node
      if: steps.node-check.outputs.setup-needed == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22

    - name: Run Core
      if: contains(fromJson('["push", "pull_request", "release"]'), github.event_name)
      shell: bash
      run: node "$GITHUB_ACTION_PATH/core/dist/index.js"
      env:
        INPUT_KONG-PRIVATE-KEY: ${{ inputs.kong-private-key }}
        INPUT_NPM-TOKEN: ${{ inputs.npm-token }}
        INPUT_PYPI-TOKEN: ${{ inputs.pypi-token }}
        INPUT_PYPI-BETA-TOKEN: ${{ inputs.pypi-beta-token }}
        INPUT_RUBYGEMS-KEY: ${{ inputs.rubygems-key }}
        INPUT_CARGO-TOKEN: ${{ inputs.cargo-token }}
